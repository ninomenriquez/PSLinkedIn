name: Build arm64 dylibs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dylibs.yml'
      - 'Makefile'
      - 'src/**'
      - 'modules/**'
      - '.gitmodules'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.ci-theos
      THEOS_REF: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
      LOGOS_REF: a62370066a97e36d59b200a9fa10c5091f5e8972
      SDK_REF: fa4a2d866231985fa9538fafc800421aa99b83f2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Theos and iOS 16.2 SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install ldid make
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_REF"
          git -C "$THEOS" submodule update --init --recursive
          git -C "$THEOS/vendor/logos" fetch origin "$LOGOS_REF"
          git -C "$THEOS/vendor/logos" checkout --detach "$LOGOS_REF"
          test "$(git -C "$THEOS/vendor/logos" rev-parse HEAD)" = "$LOGOS_REF"
          git clone --filter=blob:none --no-checkout https://github.com/xybp888/iOS-SDKs.git "$RUNNER_TEMP/ios-sdks"
          git -C "$RUNNER_TEMP/ios-sdks" sparse-checkout set iPhoneOS16.2.sdk
          git -C "$RUNNER_TEMP/ios-sdks" checkout --detach "$SDK_REF"
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/ios-sdks/iPhoneOS16.2.sdk" "$THEOS/sdks/"
          test -f "$THEOS/sdks/iPhoneOS16.2.sdk/SDKSettings.plist"
      - name: Build unchanged tweak and sideload dependencies
        run: |
          set -euo pipefail
          # Upstream uses lower-case modules/flexing; use the actual gitlink casing.
          # Build FLEXing explicitly so its aggregate libflex project is also built.
          gmake -j3 ARCHS=arm64 TARGET=iphone:clang:16.2:15.0
          gmake -C modules/FLEXing -j3 ARCHS=arm64 TARGET=iphone:clang:16.2:15.0 THEOS_PACKAGE_SCHEME=
      - name: Verify and collect libraries
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for name in PSLinkedIn FLEXing libFLEX; do
            path="$(find .theos/obj modules/FLEXing/.theos/obj -type f -name "$name.dylib" ! -path "*/arm64/*" -print -quit)"
            test -n "$path"
            test "$(xcrun lipo -archs "$path")" = arm64
            cp "$path" "artifacts/$name.dylib"
            xcrun otool -L "$path"
          done
          {
            echo "Source: $GITHUB_SHA"
            echo "Theos: $THEOS_REF"
            echo "Logos: $LOGOS_REF"
            echo "SDK: xybp888/iOS-SDKs $SDK_REF iPhoneOS16.2.sdk"
            xcodebuild -version
            sw_vers
            git submodule status --recursive
            shasum -a 256 artifacts/*.dylib
          } > artifacts/BUILD-INFO.txt
          cp LICENSE NOTICE artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PSLinkedIn-v0.1.0-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
